name = "biotech-screener"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Static dashboard (public/index.html)
[assets]
directory = "./public"
binding = "ASSETS"

# Workers KV — holds screener state between cron runs (free tier)
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Cron Trigger — polls Finnhub every minute (free tier; 1 min is the minimum)
[triggers]
crons = ["* * * * *"]

# Set your API key as a secret (never commit it):
#   npx wrangler secret put FINNHUB_API_KEY
# Create the KV namespace and paste its id above:
#   npx wrangler kv namespace create STATE
